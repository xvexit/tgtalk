services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}
      SEND_ENABLED: ${SEND_ENABLED}
      BOT_TOKEN: ${BOT_TOKEN}
      TAKEOVER_HOURS: ${TAKEOVER_HOURS:-3}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-30}
      PERSONA_PATH: ${PERSONA_PATH:-config/persona.md}
      MAX_REPLIES_PER_HOUR: ${MAX_REPLIES_PER_HOUR:-10}
      PYTHONPATH: /app/src
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m tgtwin"
    restart: unless-stopped

volumes:
  postgres_data:
